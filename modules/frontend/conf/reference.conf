# Framework bootstrap -- always loaded before the environment config.
# Do NOT put environment-specific or secret values here.

play.modules.enabled += "modules.VinylDNSModule"
play.filters.enabled += "filters.AccessLoggingFilter"

play.http.parser.maxMemoryBuffer = 370K
play.i18n.langs = ["en"]

play.http.session.maxAge = 10h
play.http.session.maxAge = ${?SESSION_MAX_AGE}
play.http.session.secure = false
play.http.session.secure = ${?SESSION_SECURE}
play.http.session.httpOnly = true
play.http.session.httpOnly = ${?SESSION_HTTP_ONLY}

portal.test_login = false
portal.test_login = ${?TEST_LOGIN}

vinyldns.base-version = "unset"
vinyldns.version = ${vinyldns.base-version}
vinyldns.version = ${?VINYLDNS_VERSION}

links = [
  { displayOnSidebar = true, displayOnLoginScreen = true, title = "API Documentation", href = "http://vinyldns.io", icon = "fa fa-file-text-o" }
]

dns-change-notices = [
  { status = "Complete", alertType = "info", text = "Your changes are fully implemented. Keep in mind it may take a few hours for the changes to fully propogate out." },
  { status = "PendingReview", alertType = "info", text = "Your DNS Change requires further review. It will be approved and processed following the review.", hrefText = "See the docs for more information.", href = "https://www.vinyldns.io/portal/manual-review-scheduling" },
  { status = "Scheduled", alertType = "info", text = "If there are any changes in your scheduled DNS Change with a status of Needs Review they will be addressed prior to the scheduled date and time." }
]

mysql {
  repositories {
    user {}
    user-change {}
    task {}
  }
}

data-stores = ["mysql"]
