# Local development overrides — Play runs on 9001, API runs on 9000
http.port = 9001
portal.vinyldns.backend.url = "http://localhost:9000"
portal.vinyldns.url = "http://localhost:9001"

# Only CSRF-check form-encoded POSTs. JSON requests are protected by the
# browser's same-origin policy so they don't need a CSRF token.
play.filters.csrf.contentType.blackList = ["application/x-www-form-urlencoded", "multipart/form-data", "text/plain"]
