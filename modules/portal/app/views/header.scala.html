@(rootAccountName: String)(implicit request: play.api.mvc.Request[Any], meta: models.Meta)
<div class="top_nav" id="fixed-top-nav">
  <div class="nav_menu">
    <nav>
      <div class="nav toggle">
        <a id="menu_indent"><i class="fa fa-indent"></i></a>
        <a id="menu_dedent"><i class="fa fa-dedent"></i></a>
        <a id="menu_mobile"><i class="fa fa-bars"></i></a>
      </div>

      <ul class="nav navbar-nav navbar-right">
        <li class="portal-toggle-item">
          <label class="portal-toggle-label" for="portal-switch-new">
            <span class="portal-toggle-text">New Portal</span>
            <input
                    id="portal-switch-new"
                    class="portal-toggle-checkbox"
                    type="checkbox"
                    autocomplete="off"
                    aria-label="Switch to new portal"
                    onchange="if(this.checked){setTimeout(function(){window.location.href='@meta.newPortalUrl';},120);}"
            />
            <span class="portal-toggle-switch">
              <span class="portal-toggle-knob"></span>
            </span>
          </label>
        </li>
        <li class="">
          <a href="javascript:;" class="user-profile dropdown-toggle" data-toggle="dropdown" aria-expanded="false">
            <i class="fa fa-user"></i> @rootAccountName
            <span class=" fa fa-angle-down"></span>
          </a>
          <ul class="dropdown-menu dropdown-usermenu pull-right">
            <li><a href="/download-creds-file/@rootAccountName-vinyldns-credentials.csv">
                Download API Credentials<span aria-hidden="true"></span></a>
            </li>
            <li><a href="" class="mb-control" data-toggle="modal" data-target="#mb-creds">Regenerate Credentials<span></span></a></li>
            <li><a href="" class="mb-control" data-toggle="modal" data-target="#mb-signout">Logout<span></span></a></li>
          </ul>
        </li>
      </ul>
    </nav>
  </div>
</div>

<script>
  (function () {
    function resetPortalSwitch() {
      var toggle = document.getElementById('portal-switch-new');
      if (toggle) toggle.checked = false;
    }
    resetPortalSwitch();

    // Handle browser back/forward navigation where pages may come from bfcache.
    window.addEventListener('pageshow', resetPortalSwitch);
  })();
</script>
